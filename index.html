<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Huehuller Glehyson da Silva Veine">
    <meta name="description" content="Sistema de Ordem de Serviço Simplificada">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/default.css">

    <title>SOSS — Sistema de Ordem de Serviço Simplificada</title>

    <script defer src="vendor/jspdf.umd.min.js"></script>
    <script defer src="js/default.js"></script>
</head>

<body>
    <main id="principal" class="centralizar">
        <h2 style="margin: 0; margin-bottom: 10px;">Ordem de Serviço</h2>

        <label for="modelo">Modelo</label><br>
        <input type="text" id="modelo" placeholder="Bomba 50cc"><br><br>

        <label for="codigo">Código</label><br>
        <input type="text" id="codigo" placeholder="Tom-447"><br><br>

        <label for="setor">Setor</label><br>
        <input type="text" id="setor" placeholder="Prensa"><br><br>

        <label for="data">Data:</label><br>
        <input type="date" id="data"><br><br>

        <label for="acao">Resumo:</label><br>
        <input
            type="text"
            id="acao"
            placeholder="Ação (ex: Manutenção preventiva)"
        ><br><br>

        <label for="desc">Descrição:</label><br>
        <textarea
            id="desc"
            placeholder="Descrição do serviço"
            rows="10"
        ></textarea><br>

        <p id="proxima-os" aria-live="polite"></p>

        <div class="acoes">
            <button
                type="button"
                onclick="definirProximoId()"
                title="Define manualmente o próximo número da OS"
            >
                Definir próximo Nº
            </button>

            <button type="button" onclick="gerarPDF()">Gerar PDF</button>
            <button type="button" onclick="limparFormulario()">Limpar formulário</button>
            <button type="button" onclick="exportarBackup()">Exportar backup</button>
            <button type="button" onclick="selecionarBackup()">Importar backup</button>
        </div>

        <input
            type="file"
            id="arquivo-backup"
            accept=".json,application/json"
            hidden
        >

        <section id="historico-local" aria-labelledby="titulo-historico">
            <div class="cabecalho-historico">
                <h3 id="titulo-historico">Histórico local</h3>
                <span id="total-ordens">0 ordens registradas</span>
            </div>

            <p id="historico-vazio">
                Nenhuma Ordem de Serviço foi registrada neste navegador.
            </p>

            <div id="tabela-historico" class="tabela-historico" hidden>
                <table>
                    <thead>
                        <tr>
                            <th>Nº</th>
                            <th>Data</th>
                            <th>Modelo</th>
                            <th>Código</th>
                            <th>Setor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-historico"></tbody>
                </table>
            </div>
        </section>
        <footer class="credito-autoria">
            SOSS — Desenvolvido por <strong>Huehuller</strong>
        </footer>
    </main>
</body>
</html>
